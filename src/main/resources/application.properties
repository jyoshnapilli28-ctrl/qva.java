# =============================================
# Private Chat Server - Application Configuration
# =============================================

# Server
server.port=8080
server.address=127.0.0.1

# Application name
spring.application.name=private-chat-server

# =============================================
# Database - SQLite
# =============================================
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/chat.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Connection pool - use Hikari with SQLite-friendly settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# =============================================
# Flyway Database Migrations
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =============================================
# Security
# =============================================
spring.security.user.name=admin
spring.security.user.password=disabled-use-custom-auth

# Tailscale Serve forwards HTTPS traffic to this loopback-only application.
server.forward-headers-strategy=framework
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# =============================================
# WebSocket
# =============================================
chat.websocket.endpoint=/ws/chat
chat.message.max-length=2000
chat.history.default-limit=100

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Info
info.app.name=Private VPN Chat
info.app.version=1.0.0
info.app.description=Private group chat over Tailscale VPN

# =============================================
# Logging
# =============================================
logging.level.com.privatechat=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
