<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>

<!-- ============================================================
     LOGIN SCREEN
     ============================================================ -->
<div id="login-screen" class="screen">
    <div class="login-box">
        <h1 class="login-title">Private Chat</h1>
        <p class="login-subtitle">VPN Group Chat</p>

        <form id="login-form" autocomplete="on">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       autocomplete="username" placeholder="jyoshna" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <div id="login-error" class="login-error hidden"></div>
            <button type="submit" id="login-btn">Sign In</button>
        </form>
    </div>
</div>

<!-- ============================================================
     CHAT SCREEN
     ============================================================ -->
<div id="chat-screen" class="screen hidden">

    <header class="app-header">
        <div class="app-header-left">
            <span class="app-name">Private Chat</span>
            <span id="connection-status" class="status-badge connecting">Connecting…</span>
        </div>
        <div class="app-header-right">
            <span id="current-user-label" class="current-user"></span>
            <button id="logout-btn" class="btn-logout">Sign Out</button>
        </div>
    </header>

    <div class="layout">

        <!-- Sidebar: member list -->
        <aside class="sidebar">
            <div class="sidebar-title">Members</div>
            <ul id="member-list" class="member-list">
                <!-- Populated by JS -->
            </ul>
        </aside>

        <!-- Main: messages + input -->
        <main class="chat-area">
            <div id="messages-container" class="messages-container">
                <div id="messages-list" class="messages-list">
                    <!-- Messages rendered by JS -->
                </div>
                <div id="scroll-anchor"></div>
            </div>

            <div class="message-input-bar">
                <input type="text" id="message-input"
                       placeholder="Type a message…"
                       maxlength="2000"
                       autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </main>

    </div>
</div>

<!-- SockJS + STOMP -->
<script src="/js/sockjs.min.js"></script>
<script src="/js/stomp.min.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
