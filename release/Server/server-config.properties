# Server Configuration
# ====================
# Port to listen on (default: 8080)
SERVER_PORT=8080

# Interface binding (default: auto).
# When set to auto, the server binds to the detected Tailscale IP (100.x.x.x)
# for strict private network isolation. Set to 0.0.0.0 to listen on all interfaces.
SERVER_BIND_ADDRESS=auto

